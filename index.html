<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CYBER_RUNNER // 2077</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0221;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 400px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3), 0 0 10px rgba(0, 240, 255, 0.3);
            border: 2px solid #00f0ff;
            border-radius: 8px;
            overflow: hidden;
            background: #0d0221;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Elements */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff, 0 0 15px #00f0ff;
            letter-spacing: 2px;
        }

        .high-score {
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f, 0 0 15px #ff007f;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 2, 33, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 42px;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f;
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
        }

        p {
            font-size: 16px;
            color: #00f0ff;
            text-shadow: 0 0 5px #00f0ff;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-align: center;
        }

        .btn {
            background: transparent;
            color: #ffe600;
            border: 2px solid #ffe600;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 10px #ffe600, inset 0 0 10px #ffe600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: #ffe600;
            color: #0d0221;
            box-shadow: 0 0 20px #ffe600, 0 0 40px #ffe600;
        }

        .controls-hint {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: rgba(0, 240, 255, 0.6);
            text-shadow: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="scoreboard">
                <span class="high-score">HI <span id="highScoreText">00000</span></span>
                <span class="current-score">SCORE <span id="scoreText">00000</span></span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="overlay-screen">
            <h1>CYBER_RUNNER</h1>
            <p>NEON ESCAPE // PROTOCOL 2077</p>
            <button id="startBtn" class="btn">INITIALIZE</button>
            <div class="controls-hint">SPACE / UP: Jump | DOWN: Duck | TAP: Jump</div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay-screen hidden">
            <h1 style="color: #ff0055; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;">SYSTEM CRASH</h1>
            <p id="finalScoreText">SCORE: 00000</p>
            <button id="restartBtn" class="btn">REBOOT</button>
            <div class="controls-hint">Press SPACE or TAP to restart</div>
        </div>
    </div>

    <script>
        // --- Web Audio API Synth Sound System ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playScore() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5

                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playCrash() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const audio = new SoundFX();

        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const finalScoreText = document.getElementById('finalScoreText');

        // Internal Game Resolution
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 350;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        const GROUND_Y = 280;

        // Game Variables
        let isRunning = false;
        let isGameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('cyber_runner_hi') || 0;
        let gameSpeed = 6;
        let frameCount = 0;
        let lastTime = 0;

        highScoreText.textContent = String(Math.floor(highScore)).padStart(5, '0');

        // Controls State
        const keys = { jump: false, duck: false };

        // --- Input Handlers ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                audio.init();
                if (!isRunning && !isGameOver) startGame();
                else if (isGameOver) restartGame();
                else keys.jump = true;
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                keys.duck = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') keys.jump = false;
            if (e.code === 'ArrowDown') keys.duck = false;
        });

        // Touch Support
        window.addEventListener('touchstart', (e) => {
            audio.init();
            if (!isRunning && !isGameOver) startGame();
            else if (isGameOver) restartGame();
            else keys.jump = true;
        });

        window.addEventListener('touchend', () => { keys.jump = false; });

        startBtn.addEventListener('click', () => { audio.init(); startGame(); });
        restartBtn.addEventListener('click', () => { audio.init(); restartGame(); });

        // --- Particle System ---
        let particles = [];
        class Particle {
            constructor(x, y, color, vx, vy, size, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.maxLife = life;
                this.life = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const vx = (Math.random() - 0.5) * 4;
                const vy = (Math.random() - 0.5) * 4;
                const size = Math.random() * 4 + 2;
                particles.push(new Particle(x, y, color, vx, vy, size, 20 + Math.random() * 10));
            }
        }

        // --- Player Character (Cyber Dino) ---
        class Player {
            constructor() {
                this.x = 80;
                this.y = GROUND_Y - 40;
                this.width = 40;
                this.height = 40;
                this.vy = 0;
                this.gravity = 0.65;
                this.jumpStrength = -12;
                this.isGrounded = false;
                this.isDucking = false;
                this.color = '#00f0ff';
            }

            update() {
                // Duck Logic
                if (keys.duck && this.isGrounded) {
                    this.isDucking = true;
                    this.height = 24;
                } else {
                    this.isDucking = false;
                    this.height = 40;
                }

                // Jump Logic
                if (keys.jump && this.isGrounded) {
                    this.vy = this.jumpStrength;
                    this.isGrounded = false;
                    audio.playJump();
                    createParticles(this.x + this.width / 2, this.y + this.height, '#00f0ff', 12);
                }

                // Physics
                this.vy += this.gravity;
                this.y += this.vy;

                // Ground Collision
                const currentGroundY = GROUND_Y - this.height;
                if (this.y >= currentGroundY) {
                    if (!this.isGrounded) {
                        // Just landed
                        createParticles(this.x + this.width / 2, currentGroundY + this.height, '#00f0ff', 6);
                    }
                    this.y = currentGroundY;
                    this.vy = 0;
                    this.isGrounded = true;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                if (this.isDucking) {
                    // Sleek low-profile shape
                    ctx.fillRect(this.x, this.y, this.width + 10, this.height);
                    // Visor
                    ctx.fillStyle = '#ff007f';
                    ctx.fillRect(this.x + this.width, this.y + 4, 8, 6);
                } else {
                    // Angular cyber runner shape
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.height);
                    ctx.lineTo(this.x + 10, this.y);
                    ctx.lineTo(this.x + this.width - 5, this.y);
                    ctx.lineTo(this.x + this.width, this.y + 15);
                    ctx.lineTo(this.x + this.width - 10, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();

                    // Neon Visor
                    ctx.fillStyle = '#ff007f';
                    ctx.shadowColor = '#ff007f';
                    ctx.fillRect(this.x + 22, this.y + 6, 14, 6);

                    // Running trail line
                    ctx.strokeStyle = '#ffe600';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 10, this.y + this.height - 5);
                    ctx.lineTo(this.x, this.y + this.height - 5);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // --- Obstacles (Neon Cacti & Drones) ---
        class Obstacle {
            constructor() {
                this.markedForDeletion = false;
                this.type = Math.random() < 0.7 ? 'cactus' : 'drone';

                if (this.type === 'cactus') {
                    this.width = 20 + Math.random() * 20;
                    this.height = 35 + Math.random() * 25;
                    this.x = GAME_WIDTH + 50;
                    this.y = GROUND_Y - this.height;
                    this.color = '#ff007f';
                } else { // Flying Drone
                    this.width = 35;
                    this.height = 20;
                    this.x = GAME_WIDTH + 50;
                    // Fly high (jump under) or low (duck under)
                    this.y = Math.random() < 0.5 ? GROUND_Y - 70 : GROUND_Y - 35;
                    this.color = '#ffe600';
                    this.wingOffset = 0;
                }
            }

            update() {
                this.x -= gameSpeed;
                if (this.x + this.width < -50) this.markedForDeletion = true;

                if (this.type === 'drone') {
                    this.wingOffset = Math.sin(frameCount * 0.2) * 5;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                if (this.type === 'cactus') {
                    // Geometric Laser Barrier / Cactus
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    // Internal Tech Pattern
                    ctx.fillStyle = '#0d0221';
                    ctx.fillRect(this.x + 4, this.y + 6, this.width - 8, this.height - 12);
                } else {
                    // Flying Cyber Drone
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    // Wings
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 10, this.y + 10 + this.wingOffset);
                    ctx.lineTo(this.x + this.width + 10, this.y + 10 - this.wingOffset);
                    ctx.stroke();
                    // Red Eye Sensor
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(this.x + 5, this.y + 6, 8, 8);
                }
                ctx.restore();
            }
        }

        // --- Background & World Renderer ---
        let bgOffset = 0;
        function drawBackground(ctx) {
            // Parallax Synthwave Grid Track
            bgOffset = (bgOffset + gameSpeed) % 40;

            ctx.save();
            // Horizon Line
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff007f';
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(GAME_WIDTH, GROUND_Y);
            ctx.stroke();

            // Moving Ground Grid Lines
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 0;

            for (let x = -bgOffset; x < GAME_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x - 20, GAME_HEIGHT);
                ctx.stroke();
            }

            // Horizontal Perspective Lines below ground
            for (let y = GROUND_Y + 15; y < GAME_HEIGHT; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }

            // Distant Synth Sun/Moon
            const grad = ctx.createLinearGradient(0, 20, 0, 120);
            grad.addColorStop(0, '#ffe600');
            grad.addColorStop(1, '#ff007f');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff007f';
            ctx.beginPath();
            ctx.arc(GAME_WIDTH / 2, 80, 45, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // --- Game Initialization & Engine ---
        let player;
        let obstacles = [];
        let nextObstacleTimer = 0;

        function startGame() {
            isRunning = true;
            isGameOver = false;
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            obstacles = [];
            particles = [];
            player = new Player();
            nextObstacleTimer = 100;

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            startGame();
        }

        function triggerGameOver() {
            isRunning = false;
            isGameOver = true;
            audio.playCrash();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyber_runner_hi', highScore);
                highScoreText.textContent = String(Math.floor(highScore)).padStart(5, '0');
            }

            finalScoreText.textContent = `SCORE: ${String(Math.floor(score)).padStart(5, '0')}`;
            gameOverScreen.classList.remove('hidden');
        }

        // Axis-Aligned Bounding Box Collision Detection
        function checkCollision(rect1, rect2) {
            const padding = 6; // Tight hitboxes for precision
            return (
                rect1.x + padding < rect2.x + rect2.width - padding &&
                rect1.x + rect1.width - padding > rect2.x + padding &&
                rect1.y + padding < rect2.y + rect2.height - padding &&
                rect1.y + rect1.height - padding > rect2.y + padding
            );
        }

        // --- Main Loop ---
        function gameLoop(time) {
            if (!isRunning) return;

            frameCount++;
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Progressive Difficulty & Score
            score += 0.15;
            scoreText.textContent = String(Math.floor(score)).padStart(5, '0');

            if (Math.floor(score) > 0 && Math.floor(score) % 100 === 0 && frameCount % 6 === 0) {
                audio.playScore(); // Milestone SFX
            }

            gameSpeed = 6 + Math.floor(score / 150) * 0.75;

            // Draw Parallax World
            drawBackground(ctx);

            // Player Update
            player.update();
            player.draw(ctx);

            // Spawning Obstacles
            nextObstacleTimer--;
            if (nextObstacleTimer <= 0) {
                obstacles.push(new Obstacle());
                nextObstacleTimer = Math.floor(Math.random() * 50 + 800 / gameSpeed);
            }

            // Obstacles Update & Draw
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw(ctx);

                // Collision Check
                if (checkCollision(player, obs)) {
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0055', 25);
                    triggerGameOver();
                }

                if (obs.markedForDeletion) {
                    obstacles.splice(i, 1);
                }
            }

            // Particles System Update
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        // Draw initial resting scene behind overlay
        drawBackground(ctx);
    </script>
</body>
</html>
